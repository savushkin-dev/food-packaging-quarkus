services:
  foodpack:
    build:
      context: .
      args:
        QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
    container_name: foodpack
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    env_file:
      - .env
    environment:
      - QUARKUS_PROFILE=${QUARKUS_PROFILE:-prod}
    volumes:
      - ./logs:/app/logs
    restart: always
