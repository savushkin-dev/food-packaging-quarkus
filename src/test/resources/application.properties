# Test configuration without H2 database
# Configure datasource to skip validation (connection will only be created when actually used)
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=mssql
quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=test;trustServerCertificate=true;encrypt=false
quarkus.datasource.username=sa
quarkus.datasource.password=test
quarkus.datasource.jdbc.background-validation=false
quarkus.datasource.jdbc.validate-on-create=false
quarkus.datasource.jdbc.leak-detection-interval=0
quarkus.datasource.jdbc.acquisition-timeout=1s

# Hibernate configuration - keep enabled for EntityManager but don't validate connection
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.metrics.enabled=false
quarkus.hibernate-orm.validate-in-dev-mode=false

# Override HTTP port (main config uses ${HTTP_PORT})
quarkus.http.port=${HTTP_PORT}

# ConfigProperties - override environment variable placeholders
db.url=jdbc:sqlserver://localhost:1433;databaseName=test;trustServerCertificate=true;encrypt=false
ksk=test
krc=test
krca=test
