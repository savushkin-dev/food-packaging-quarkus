# H2 testdb - These properties override main application.properties and environment variables during tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS dbo
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# ConfigProperties - Override environment variables
db.url=jdbc:h2:mem:test
ksk=test
krc=test
krca=test

# Disable datasource validation during build (prevents JaCoCo prepare-agent from trying to connect)
quarkus.datasource.devservices.enabled=false
