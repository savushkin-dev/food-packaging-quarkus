# В паре с jacoco-maven-plugin <excludes> (pom.xml) и sonar.coverage.exclusions (pom.xml).
# При изменении одного списка не забыть обновить остальные два.
ignore:
  - "src/main/java/org/acme/foodpackaging/repository/**"
  - "src/main/java/org/acme/foodpackaging/entity/**"
  - "src/main/java/org/acme/foodpackaging/record/**"
  - "src/main/java/org/acme/foodpackaging/rest/**"
  - "src/main/java/org/acme/foodpackaging/persistence/**"
  - "src/main/java/org/acme/foodpackaging/sql/**"
  - "src/main/java/org/acme/foodpackaging/dto/**"
  - "src/main/java/org/acme/foodpackaging/exception/**"
  - "src/main/java/org/acme/foodpackaging/config/**"
  - "src/main/java/org/acme/foodpackaging/solver/**"
  - "src/main/java/org/acme/foodpackaging/service/load/**"
  - "src/main/java/org/acme/foodpackaging/service/upload/**"
  - "src/main/java/org/acme/foodpackaging/utils/**"
  - "src/main/java/org/acme/foodpackaging/excel/**"
  - "src/main/java/org/acme/foodpackaging/service/solution/SolutionImporter.java"
