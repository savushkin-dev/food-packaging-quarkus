name: ci
on:
  push:
    branches:
      - develop_rc
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@3fcc89cfffc2849b30db65e307563a169b16593f

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d586dba76842633160b90ff13307931c438ec12e

      - name: Build image (no push)
        uses: docker/build-push-action@155e77ab841256037cbe7b6ce8f1f801bb5db805
        with:
          context: .
          push: false
          tags: foodpack:latest
          build-args: |
            QUARKUS_PROFILE=prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
