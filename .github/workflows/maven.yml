name: Java CI with Maven (Quarkus)

on:
  push:
    branches:
      - prod_scheduler
      - develop_rc
  pull_request:
    branches:
      - prod_scheduler
      - develop_rc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Quarkus)
        run: mvn clean verify
